version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Minor and patch updates arrive as one PR; major updates stay separate
    # so breaking changes can be reviewed on their own.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # React Native and the packages pinned to it are upgraded together by hand;
    # see "Dependency constraints" in docs/architecture.md.
    ignore:
      # Pinned to the renderer embedded in the installed React Native release.
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      # The React Native package family must stay on one release.
      - dependency-name: "react-native"
      - dependency-name: "@react-native/*"
      # @react-native/eslint-config supports ESLint 8.x and 9.x only.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
