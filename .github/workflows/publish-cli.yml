name: Publish CLI

# Publishes packages/create-medusa-mobile when a release tag such as
# create-medusa-mobile@0.1.0 is pushed. The published CLI clones the template at
# that same tag. Publishing uses npm trusted publishing, configured for this
# workflow in the package's settings on npmjs.com; no token is stored.
on:
  push:
    tags: ['create-medusa-mobile@*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use project npm version
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Check the tag matches the package version
        id: version
        run: |
          version="$(node --print "require('./packages/create-medusa-mobile/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "create-medusa-mobile@$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci
      - name: Configure test environment
        run: cp .env.template .env
      - name: Verify
        run: npm run verify
      - name: Publish
        working-directory: packages/create-medusa-mobile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "create-medusa-mobile@$VERSION" version >/dev/null 2>&1; then
            echo "create-medusa-mobile@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public
